# Local Worker for the regulatory reporting dataset. Role keys are in .dev.vars beside this file.
# The D1 database is persisted in ../db via --persist-to (see the scripts in package.json).
name = "study-data-regulatory-reporting"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
DATASET = "regulatory_reporting"

[[d1_databases]]
binding = "DB"
database_name = "regulatory_reporting"
database_id = "00000000-0000-0000-0000-000000000047"

[dev]
port = 8847
inspector_port = 9847  # debugger port; fixed so several datasets can run at once

# Lets the Worker import docs/theme.css and the packs' Markdown files as text.
[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.md"]
fallthrough = true
